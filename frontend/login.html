<!DOCTYPE html>
<html lang="ru" data-theme="light">
<head>
  <meta charset="UTF-8">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Вход — LogiCRM</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300..700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/app.css">
  <style>
    body { display: flex; align-items: center; justify-content: center; overflow: auto; }
    .login-wrap {
      width: 100%; max-width: 420px; padding: 1.5rem;
      display: flex; flex-direction: column; gap: 2rem; align-items: center;
    }
    .login-logo { display: flex; align-items: center; gap: .75rem; color: var(--text); }
    .login-logo svg { color: var(--primary); }
    .login-logo-name { font-size: 1.5rem; font-weight: 700; letter-spacing: -.02em; }
    .login-logo-name span { color: var(--primary); }
    .login-card {
      width: 100%; background: var(--surface);
      border: 1px solid var(--border); border-radius: var(--r-xl);
      padding: 2rem; box-shadow: var(--shadow-md);
    }
    .login-card h1 { font-size: 1.2rem; font-weight: 600; margin-bottom: .35rem; }
    .login-card p  { color: var(--text-muted); font-size: .9em; margin-bottom: 1.75rem; }
    .login-fields  { display: flex; flex-direction: column; gap: 1rem; }
    .login-btn {
      width: 100%; padding: .65rem;
      background: var(--primary); color: #fff;
      border: none; border-radius: var(--r-md);
      font-size: 1em; font-weight: 600; cursor: pointer; margin-top: .5rem;
      transition: background var(--t);
    }
    .login-btn:hover { background: var(--primary-hover); }
    .login-btn:disabled { opacity: .6; pointer-events: none; }
    .login-error {
      background: color-mix(in oklch, var(--error) 10%, var(--surface));
      border: 1px solid color-mix(in oklch, var(--error) 30%, var(--border));
      color: var(--error); padding: .65rem .9rem;
      border-radius: var(--r-md); font-size: .88em; display: none;
    }
    .login-error.show { display: block; }
    .login-footer { font-size: .78rem; color: var(--text-faint); text-align: center; }
  </style>
</head>
<body>
  <div class="login-wrap">
    <div class="login-logo">
      <svg width="36" height="36" viewBox="0 0 40 40" fill="none">
        <rect width="40" height="40" rx="10" fill="currentColor" opacity=".08"/>
        <path d="M10 8 L10 28 L26 28" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
        <circle cx="30" cy="14" r="4" fill="currentColor"/>
        <path d="M10 17 C16 17 22 11 30 14" stroke="currentColor" stroke-width="1.5" stroke-dasharray="2 2" opacity=".5"/>
      </svg>
      <span class="login-logo-name">Logi<span>CRM</span></span>
    </div>

    <div class="login-card">
      <h1>Вход в систему</h1>
      <p>CRM для продаж логистических услуг</p>
      <div id="loginError" class="login-error"></div>
      <div class="login-fields">
        <div class="field">
          <label class="field-label" for="email">Email</label>
          <input id="email" type="email" class="input" placeholder="admin@company.com" autocomplete="email">
        </div>
        <div class="field">
          <label class="field-label" for="password">Пароль</label>
          <input id="password" type="password" class="input" placeholder="••••••••" autocomplete="current-password">
        </div>
        <button id="submitBtn" class="login-btn">Войти</button>
      </div>
    </div>

    <div class="login-footer">LogiCRM · Спринт 2</div>
  </div>

  <script type="module">
    import { login } from '/js/auth.js';

    const saved = localStorage.getItem('logicrm_theme');
    if (saved) document.documentElement.setAttribute('data-theme', saved);

    const emailEl = document.getElementById('email');
    const passEl  = document.getElementById('password');
    const btn     = document.getElementById('submitBtn');
    const errEl   = document.getElementById('loginError');

    function showErr(msg) { errEl.textContent = msg; errEl.classList.add('show'); }
    function clearErr()   { errEl.classList.remove('show'); }

    async function doLogin() {
      clearErr();
      const email = emailEl.value.trim(), password = passEl.value;
      if (!email || !password) return showErr('Введите email и пароль');
      btn.disabled = true; btn.textContent = 'Входим…';
      const r = await login(email, password);
      btn.disabled = false; btn.textContent = 'Войти';
      if (!r.ok) return showErr(r.error);
      location.href = r.user.role === 'ops' ? '/requests.html' : '/index.html';
    }

    btn.addEventListener('click', doLogin);
    document.addEventListener('keydown', e => { if (e.key === 'Enter') doLogin(); });
    emailEl.focus();
  </script>
</body>
</html>
