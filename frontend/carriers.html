<!DOCTYPE html>
<html lang="ru" data-theme="light">
<head>
  <meta charset="UTF-8">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Перевозчики — LogiCRM</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300..700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/app.css">
  <style>
    html { visibility: hidden; }
    .carriers-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
      gap: 1rem;
      padding: 1.5rem;
    }
    .carrier-card {
      background: var(--surface); border: 1px solid var(--border);
      border-radius: var(--r-lg); padding: 1rem;
      cursor: pointer; transition: border-color var(--t), box-shadow var(--t);
      box-shadow: var(--shadow-sm);
    }
    .carrier-card:hover { border-color: var(--primary); box-shadow: var(--shadow-md); }
    .carrier-card.inactive { opacity: .5; }
    .carrier-head { display:flex; align-items:flex-start; gap:.75rem; margin-bottom:.75rem; }
    .carrier-ava  {
      width:42px; height:42px; border-radius:var(--r-md);
      background:var(--primary-subtle); color:var(--primary);
      display:flex; align-items:center; justify-content:center;
      font-size:1rem; font-weight:700; flex-shrink:0;
    }
    .carrier-ava.inactive { background:var(--surface-off); color:var(--text-faint); }
    .carrier-name { font-weight:600; font-size:.95em; line-height:1.2; }
    .carrier-inn  { font-size:.72rem; color:var(--text-muted); margin-top:2px; }
    .stars { display:flex; gap:2px; }
    .star { width:13px; height:13px; color:var(--text-faint); }
    .star.filled { color:var(--orange); }
    .carrier-chips { display:flex; flex-wrap:wrap; gap:.3rem; margin:.5rem 0; }
    .carrier-row { display:flex; align-items:center; gap:.4rem; font-size:.78rem; color:var(--text-muted); margin-top:.35rem; }
    .carrier-row svg { width:12px; height:12px; flex-shrink:0; }
    .carrier-row a { color:var(--text); }
    .carrier-row a:hover { color:var(--primary); }
    .carrier-row .rate { color:var(--text); font-weight:500; }
    .on-time-bar { height:4px; border-radius:var(--r-full); background:var(--surface-off); overflow:hidden; margin-top:.5rem; }
    .on-time-fill { height:100%; border-radius:var(--r-full); background:var(--success); }
    .on-time-fill.warn { background:var(--warning); }
    .on-time-fill.bad  { background:var(--error); }
    @media(max-width:900px){ .carriers-grid { padding:1rem; grid-template-columns:1fr; } }
  </style>
</head>
<body>
  <div class="sidebar-overlay" id="sidebarOverlay"></div>
  <aside class="sidebar" id="sidebar"></aside>

  <div class="main">
    <header class="topbar">
      <button class="menu-btn" id="menuBtn">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
      </button>
      <h1 class="topbar-title">Перевозчики <span class="count" id="totalCount"></span></h1>
      <button class="btn btn-primary" id="btnNew">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
        Добавить
      </button>
    </header>

    <div class="toolbar">
      <div class="search-wrap">
        <svg class="search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
        <input id="searchInput" class="search-input" placeholder="Название, ИНН…">
      </div>
      <select id="fTransport" class="filter-select">
        <option value="">Все типы</option>
        <option value="auto">Авто</option>
        <option value="rail">ЖД</option>
        <option value="sea">Море</option>
        <option value="air">Авиа</option>
        <option value="multimodal">Мультимодал</option>
      </select>
      <select id="fActive" class="filter-select">
        <option value="">Активные</option>
        <option value="all">Все</option>
        <option value="false">Заблокированные</option>
      </select>
    </div>

    <div class="content-bare" style="overflow-y:auto">
      <div class="carriers-grid" id="carriersList">
        <div class="skeleton" style="height:160px;border-radius:var(--r-lg)"></div>
        <div class="skeleton" style="height:160px;border-radius:var(--r-lg)"></div>
        <div class="skeleton" style="height:160px;border-radius:var(--r-lg)"></div>
      </div>
    </div>
  </div>

  <!-- Modal -->
  <div class="modal-backdrop" id="carrierModal">
    <div class="modal" style="max-width:620px">
      <div class="modal-head">
        <h3 class="modal-title" id="modalTitle">Новый перевозчик</h3>
        <button class="icon-btn" id="modalClose"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg></button>
      </div>
      <div class="modal-body">
        <input type="hidden" id="cId">
        <div class="form-grid form-grid-2">
          <div class="field col-span-2"><label class="field-label">Название <span class="req">*</span></label><input id="cName" class="input" placeholder="ООО Транспорт"></div>
          <div class="field"><label class="field-label">ИНН</label><input id="cInn" class="input" maxlength="12"></div>
          <div class="field"><label class="field-label">ОГРН</label><input id="cOgrn" class="input"></div>
          <div class="field"><label class="field-label">Контактное лицо</label><input id="cContact" class="input"></div>
          <div class="field"><label class="field-label">Телефон</label><input id="cPhone" class="input" placeholder="+7…"></div>
          <div class="field"><label class="field-label">Email</label><input id="cEmail" type="email" class="input"></div>
          <div class="field"><label class="field-label">Telegram</label><input id="cTg" class="input" placeholder="@username"></div>
        </div>

        <div class="section-title" style="margin:.5rem 0 0">Специализация</div>
        <div class="field"><label class="field-label">Типы перевозок</label>
          <div class="chip-group" id="transportChips">
            <span class="chip" data-v="auto">Авто</span>
            <span class="chip" data-v="rail">ЖД</span>
            <span class="chip" data-v="sea">Море</span>
            <span class="chip" data-v="air">Авиа</span>
            <span class="chip" data-v="multimodal">Мультимодал</span>
            <span class="chip" data-v="customs">Таможня</span>
          </div>
        </div>
        <div class="field"><label class="field-label">Направления</label>
          <div class="chip-group" id="directionChips">
            <span class="chip" data-v="central">Центр</span>
            <span class="chip" data-v="south">Юг</span>
            <span class="chip" data-v="ural">Урал</span>
            <span class="chip" data-v="siberia">Сибирь</span>
            <span class="chip" data-v="far_east">Дальний Восток</span>
            <span class="chip" data-v="international">Международные</span>
          </div>
        </div>

        <div class="section-title" style="margin:.5rem 0 0">Ставки и надёжность</div>
        <div class="form-grid form-grid-3">
          <div class="field"><label class="field-label">Рейтинг (1-5)</label>
            <select id="cRating" class="select"><option value="5">★★★★★ Отлично</option><option value="4">★★★★ Хорошо</option><option value="3" selected>★★★ Нормально</option><option value="2">★★ Плохо</option><option value="1">★ Ужасно</option></select>
          </div>
          <div class="field"><label class="field-label">В срок, %</label><input id="cOnTime" type="number" class="input" min="0" max="100" placeholder="95"></div>
          <div class="field"><label class="field-label">Всего рейсов</label><input id="cShipments" type="number" class="input" placeholder="0"></div>
          <div class="field"><label class="field-label">Ставка ₽/км</label><input id="cRateKm" type="number" class="input" placeholder="25"></div>
          <div class="field"><label class="field-label">Ставка ₽/т</label><input id="cRateTon" type="number" class="input" placeholder="1500"></div>
          <div class="field"><label class="field-label">Минимальная ставка</label><input id="cMinRate" type="number" class="input" placeholder="15000"></div>
        </div>

        <div class="form-grid form-grid-2" style="margin-top:.5rem">
          <div class="field"><label class="field-label">Лицензия истекает</label><input id="cLicense" type="date" class="input"></div>
          <div style="display:flex;flex-direction:column;gap:.5rem;justify-content:flex-end;padding-bottom:.1rem">
            <label style="display:flex;align-items:center;gap:.4rem;cursor:pointer;font-size:.88em"><input type="checkbox" id="cHasLicense"> Есть лицензия</label>
            <label style="display:flex;align-items:center;gap:.4rem;cursor:pointer;font-size:.88em"><input type="checkbox" id="cVat"> Работает с НДС</label>
            <label style="display:flex;align-items:center;gap:.4rem;cursor:pointer;font-size:.88em"><input type="checkbox" id="cActive" checked> Активный партнёр</label>
          </div>
        </div>
        <div class="field"><label class="field-label">Примечания</label><textarea id="cNotes" class="textarea" rows="2"></textarea></div>
      </div>
      <div class="modal-foot">
        <div class="modal-foot-left">
          <button class="btn btn-danger" id="btnDelete" hidden>Удалить</button>
        </div>
        <button class="btn btn-ghost" id="mCancel">Отмена</button>
        <button class="btn btn-primary" id="mSave">Сохранить</button>
      </div>
    </div>
  </div>

  <div class="toast" id="toast"></div>

  <script type="module">
    import { initUI, esc, fmtDate, toast } from '/js/ui.js';
    import { can, ROLES } from '/js/auth.js';

    const session = await initUI({ active: 'carriers' });
    if (!session) throw new Error('no session');

    const TRANSPORT_LABELS = { auto:'Авто', rail:'ЖД', sea:'Море', air:'Авиа', multimodal:'Мульти', customs:'Таможня' };
    const DIR_LABELS = { central:'Центр', south:'Юг', ural:'Урал', siberia:'Сибирь', far_east:'Дальн. Восток', international:'Между­народные' };

    let carriers = [], editingId = null;

    async function api(method, path, body) {
      const res = await fetch('/api' + path, {
        method, credentials:'include',
        headers: body ? {'Content-Type':'application/json'} : {},
        body: body ? JSON.stringify(body) : undefined,
      });
      if (res.status === 204) return null;
      const data = await res.json();
      if (!res.ok) throw new Error(data.error || 'Ошибка');
      return data;
    }

    async function load() {
      const q  = document.getElementById('searchInput').value;
      const t  = document.getElementById('fTransport').value;
      const ac = document.getElementById('fActive').value;
      let url = '/carriers?';
      if (q)  url += `q=${encodeURIComponent(q)}&`;
      if (t)  url += `transport_type=${t}&`;
      if (ac) url += `active=${ac}&`;
      carriers = await api('GET', url).catch(() => []);
      render();
    }

    await load();

    function stars(n) {
      return Array.from({length:5}, (_,i) =>
        `<svg class="star${i<n?' filled':''}" viewBox="0 0 24 24" fill="${i<n?'currentColor':'none'}" stroke="currentColor" stroke-width="2"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></svg>`
      ).join('');
    }

    function render() {
      document.getElementById('totalCount').textContent = carriers.length ? `(${carriers.length})` : '';
      if (!carriers.length) {
        document.getElementById('carriersList').innerHTML = `<div class="empty-state" style="grid-column:1/-1"><h3>Перевозчиков нет</h3><p>Добавьте первого партнёра-перевозчика.</p><button class="btn btn-primary" onclick="document.getElementById('btnNew').click()">Добавить</button></div>`;
        return;
      }
      document.getElementById('carriersList').innerHTML = carriers.map(c => {
        const ini = (c.name||'?')[0].toUpperCase();
        const ot  = c.on_time_percent;
        const otClass = ot >= 90 ? '' : ot >= 75 ? ' warn' : ' bad';
        const transportChips = (c.transport_types||[]).map(t =>
          `<span class="badge badge-blue" style="font-size:.68rem"><span class="badge-dot"></span>${TRANSPORT_LABELS[t]||t}</span>`
        ).join('');
        const dirChips = (c.directions||[]).map(d =>
          `<span class="badge badge-gray" style="font-size:.68rem">${DIR_LABELS[d]||d}</span>`
        ).join('');
        const rateInfo = [];
        if (c.rate_per_km)  rateInfo.push(`${Number(c.rate_per_km).toLocaleString('ru-RU')} ₽/км`);
        if (c.rate_per_ton) rateInfo.push(`${Number(c.rate_per_ton).toLocaleString('ru-RU')} ₽/т`);
        if (c.min_rate)     rateInfo.push(`от ${Number(c.min_rate).toLocaleString('ru-RU')} ₽`);

        return `<div class="carrier-card${c.is_active?'':' inactive'}" data-id="${c.id}">
          <div class="carrier-head">
            <div class="carrier-ava${c.is_active?'':' inactive'}">${ini}</div>
            <div style="flex:1;min-width:0">
              <div class="carrier-name">${esc(c.name)}</div>
              ${c.inn ? `<div class="carrier-inn">ИНН ${esc(c.inn)}${c.is_vat?' · НДС':''}</div>` : ''}
            </div>
            <div class="stars">${stars(c.rating||3)}</div>
          </div>

          ${transportChips || dirChips ? `<div class="carrier-chips">${transportChips}${dirChips}</div>` : ''}

          ${c.contact_person ? `<div class="carrier-row"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>${esc(c.contact_person)}</div>` : ''}
          ${c.phone ? `<div class="carrier-row"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07A19.5 19.5 0 0 1 4.19 12 19.79 19.79 0 0 1 1.12 3.38 2 2 0 0 1 3.11 1h3a2 2 0 0 1 2 1.72c.127.96.361 1.903.7 2.81a2 2 0 0 1-.45 2.11L7.09 8.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 21 16.92z"/></svg><a href="tel:${esc(c.phone)}">${esc(c.phone)}</a></div>` : ''}
          ${rateInfo.length ? `<div class="carrier-row"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="12" y1="1" x2="12" y2="23"/><path d="M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/></svg><span class="rate">${rateInfo.join(' · ')}</span></div>` : ''}

          ${ot !== null ? `
            <div class="carrier-row" style="margin-top:.4rem;justify-content:space-between">
              <span>В срок</span>
              <span style="font-weight:500;color:${ot>=90?'var(--success)':ot>=75?'var(--warning)':'var(--error)'}">${ot}%</span>
            </div>
            <div class="on-time-bar"><div class="on-time-fill${otClass}" style="width:${ot}%"></div></div>
          ` : ''}

          ${c.total_shipments ? `<div style="font-size:.68rem;color:var(--text-faint);margin-top:.4rem">${c.total_shipments} рейсов в базе</div>` : ''}
        </div>`;
      }).join('');
    }

    document.getElementById('carriersList').addEventListener('click', e => {
      const card = e.target.closest('.carrier-card[data-id]');
      if (card && !e.target.closest('a')) openModal(card.dataset.id);
    });

    // ── Modal ─────────────────────────────────────────────────────────────────
    function openModal(id = null) {
      editingId = id;
      document.getElementById('modalTitle').textContent = id ? 'Перевозчик' : 'Новый перевозчик';
      document.getElementById('btnDelete').hidden = !id || !can([ROLES.ADMIN, ROLES.HEAD]);

      // Сброс чипов
      document.querySelectorAll('#transportChips .chip, #directionChips .chip').forEach(c => c.classList.remove('selected'));

      if (id) {
        const c = carriers.find(x => x.id === id);
        if (!c) return;
        document.getElementById('cId').value       = c.id;
        document.getElementById('cName').value     = c.name;
        document.getElementById('cInn').value      = c.inn || '';
        document.getElementById('cOgrn').value     = c.ogrn || '';
        document.getElementById('cContact').value  = c.contact_person || '';
        document.getElementById('cPhone').value    = c.phone || '';
        document.getElementById('cEmail').value    = c.email || '';
        document.getElementById('cTg').value       = c.telegram || '';
        document.getElementById('cRating').value   = c.rating || 3;
        document.getElementById('cOnTime').value   = c.on_time_percent ?? '';
        document.getElementById('cShipments').value= c.total_shipments || '';
        document.getElementById('cRateKm').value   = c.rate_per_km || '';
        document.getElementById('cRateTon').value  = c.rate_per_ton || '';
        document.getElementById('cMinRate').value  = c.min_rate || '';
        document.getElementById('cLicense').value  = c.license_expires || '';
        document.getElementById('cHasLicense').checked = c.has_license;
        document.getElementById('cVat').checked       = c.is_vat;
        document.getElementById('cActive').checked    = c.is_active;
        document.getElementById('cNotes').value    = c.notes || '';
        (c.transport_types||[]).forEach(v => {
          document.querySelector(`#transportChips [data-v="${v}"]`)?.classList.add('selected');
        });
        (c.directions||[]).forEach(v => {
          document.querySelector(`#directionChips [data-v="${v}"]`)?.classList.add('selected');
        });
      } else {
        ['cName','cInn','cOgrn','cContact','cPhone','cEmail','cTg','cOnTime','cShipments','cRateKm','cRateTon','cMinRate','cLicense','cNotes'].forEach(id => {
          document.getElementById(id).value = '';
        });
        document.getElementById('cId').value = '';
        document.getElementById('cRating').value = '3';
        document.getElementById('cHasLicense').checked = false;
        document.getElementById('cVat').checked = false;
        document.getElementById('cActive').checked = true;
      }

      document.getElementById('carrierModal').classList.add('open');
      document.getElementById('cName').focus();
    }

    document.querySelectorAll('#transportChips .chip, #directionChips .chip').forEach(chip => {
      chip.addEventListener('click', () => chip.classList.toggle('selected'));
    });

    function closeModal() { document.getElementById('carrierModal').classList.remove('open'); editingId = null; }
    document.getElementById('modalClose').addEventListener('click', closeModal);
    document.getElementById('mCancel').addEventListener('click', closeModal);
    document.getElementById('carrierModal').addEventListener('click', e => { if (e.target === document.getElementById('carrierModal')) closeModal(); });

    document.getElementById('mSave').addEventListener('click', async () => {
      const name = document.getElementById('cName').value.trim();
      if (!name) { toast('Введите название', 'error'); return; }
      const data = {
        name,
        inn:            document.getElementById('cInn').value,
        ogrn:           document.getElementById('cOgrn').value,
        contact_person: document.getElementById('cContact').value,
        phone:          document.getElementById('cPhone').value,
        email:          document.getElementById('cEmail').value,
        telegram:       document.getElementById('cTg').value,
        transport_types:[...document.querySelectorAll('#transportChips .chip.selected')].map(c=>c.dataset.v),
        directions:     [...document.querySelectorAll('#directionChips .chip.selected')].map(c=>c.dataset.v),
        rating:         parseInt(document.getElementById('cRating').value),
        on_time_percent:parseInt(document.getElementById('cOnTime').value)    || null,
        total_shipments:parseInt(document.getElementById('cShipments').value) || 0,
        rate_per_km:    parseFloat(document.getElementById('cRateKm').value)  || null,
        rate_per_ton:   parseFloat(document.getElementById('cRateTon').value) || null,
        min_rate:       parseFloat(document.getElementById('cMinRate').value) || null,
        has_license:    document.getElementById('cHasLicense').checked,
        license_expires:document.getElementById('cLicense').value || null,
        is_vat:         document.getElementById('cVat').checked,
        is_active:      document.getElementById('cActive').checked,
        notes:          document.getElementById('cNotes').value,
      };
      document.getElementById('mSave').disabled = true;
      try {
        if (editingId) { await api('PUT', `/carriers/${editingId}`, data); toast('Сохранено','success'); }
        else           { await api('POST', '/carriers', data); toast('Добавлен','success'); }
        closeModal(); await load();
      } catch(err) { toast(err.message,'error'); }
      finally { document.getElementById('mSave').disabled = false; }
    });

    document.getElementById('btnDelete').addEventListener('click', async () => {
      if (!editingId || !confirm('Удалить перевозчика?')) return;
      try { await api('DELETE', `/carriers/${editingId}`); closeModal(); await load(); toast('Удалено'); }
      catch(err) { toast(err.message,'error'); }
    });

    let searchTimer;
    document.getElementById('searchInput').addEventListener('input', () => {
      clearTimeout(searchTimer); searchTimer = setTimeout(load, 220);
    });
    document.getElementById('fTransport').addEventListener('change', load);
    document.getElementById('fActive').addEventListener('change', load);
    document.getElementById('btnNew').addEventListener('click', () => openModal(null));
    document.addEventListener('keydown', e => {
      if (e.target.matches('input,textarea,select')) return;
      if (e.key === 'Escape') closeModal();
      if (e.key === 'n' || e.key === 'т') openModal(null);
    });
  </script>
</body>
</html>
