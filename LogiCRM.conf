#
# LogiCRM Nginx konf
#

server {
    listen 80;
server_name mankochat.ru www.mankochat.ru;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
server_name mankochat.ru www.mankochar.ru;

    ssl_certificate     /etc/nginx/ssl/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    server_tokens off;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Frame-Options           "SAMEORIGIN" always;
    add_header X-Content-Type-Options    "nosniff" always;
    add_header Referrer-Policy           "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy        "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy   "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'" always;

    root  /var/www/logicrm/dist;
    index index.html;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    location ~* \.html$ {
        expires -1;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    location ~* ^/assets/.*\.(js|css)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    location ~* \.(js|css)$ {
        expires 1h;
        add_header Cache-Control "public, must-revalidate";
        access_log off;
    }

    location ~* \.(woff2?|ttf|svg|png|ico)$ {
        expires 7d;
        add_header Cache-Control "public";
        access_log off;
    }

    location /api/ {
        resolver 127.0.0.11 valid=10s;
        set $upstream http://backend:3000;
        proxy_pass         $upstream;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering       off;
        proxy_read_timeout    30s;
        proxy_send_timeout    30s;
        proxy_connect_timeout  5s;
    }

    location / {
        try_files $uri $uri.html $uri/ =404;
    }

    access_log /var/log/nginx/logicrm_access.log;
    error_log  /var/log/nginx/logicrm_error.log  warn;
}
