name: Deploy to production

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  # ── Security scanning — запускается до деплоя ─────────────────────────────
  security:
    name: Security Scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: npm audit — backend
        working-directory: backend
        run: npm audit --audit-level=high

      - name: npm audit — frontend
        working-directory: frontend
        run: npm audit --audit-level=high

      - name: Secret scan (Gitleaks)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ── Deploy — только после прохождения security ────────────────────────────
  deploy:
    name: Build & Deploy
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [security]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend deps
        working-directory: frontend
        run: npm ci

      - name: Build frontend (Vite)
        working-directory: frontend
        run: npm run build

      - name: Setup SSH agent
        uses: webfactory/ssh-agent@v0.10.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Set known hosts
        run: echo "${{ secrets.SSH_HOST_KEY }}" >> ~/.ssh/known_hosts

      - name: Sync backend
        run: |
          rsync -az --delete \
            --exclude='node_modules/' \
            --exclude='.env' \
            --exclude='.env.*' \
            backend/ \
            ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}:${{ secrets.DEPLOY_PATH }}/backend/

      - name: Sync frontend dist
        run: |
          rsync -az --delete \
            frontend/dist/ \
            ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}:${{ secrets.DEPLOY_PATH }}/frontend/dist/

      - name: Sync nginx config
        run: |
          rsync -az nginx/ \
            ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}:${{ secrets.DEPLOY_PATH }}/nginx/

      - name: Sync scripts and compose
        run: |
          rsync -az scripts/ \
            ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}:${{ secrets.DEPLOY_PATH }}/scripts/
          rsync -az docker-compose.yml \
            ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}:${{ secrets.DEPLOY_PATH }}/docker-compose.yml

      - name: Deploy on server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host:        ${{ secrets.SSH_HOST }}
          username:    ${{ secrets.SSH_USER }}
          key:         ${{ secrets.SSH_PRIVATE_KEY }}
          script_stop: true
          script: |
            set -e
            cd ${{ secrets.DEPLOY_PATH }}

            echo "=== Пересобираем backend ==="
            docker compose up -d --build --no-deps backend

            echo "=== Ждём готовности backend ==="
            for i in $(seq 1 20); do
              if docker exec logicrm_backend wget -qO- http://localhost:3000/api/health > /dev/null 2>&1; then
                echo "Backend готов (попытка $i)"
                break
              fi
              if [ "$i" = "20" ]; then
                echo "Backend не ответил за 60 секунд"
                docker logs logicrm_backend --tail 20
                exit 1
              fi
              echo "  ожидаем... ($i/20)"
              sleep 3
            done

            echo "=== Перезагружаем nginx ==="
            docker exec logicrm_nginx nginx -s reload

            echo "=== Деплой завершён ==="
            docker exec logicrm_backend wget -qO- http://localhost:3000/api/health
