
services:

  # ── PostgreSQL ────────────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: logicrm_db
    restart: unless-stopped
    environment:
      POSTGRES_DB:       ${DB_NAME:-logicrm}
      POSTGRES_USER:     ${DB_USER:-logicrm}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"   # доступен только с localhost
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-logicrm}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Node.js backend ───────────────────────────────────────────────────────
  backend:
    build:
      context:    ./backend
      dockerfile: Dockerfile
    container_name: logicrm_backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV:      production
      PORT:          3000
      DB_HOST:       postgres
      DB_PORT:       5432
      DB_NAME:       ${DB_NAME:-logicrm}
      DB_USER:       ${DB_USER:-logicrm}
      DB_PASSWORD:   ${DB_PASSWORD}
      JWT_SECRET:    ${JWT_SECRET}
      CORS_ORIGIN:   ${CORS_ORIGIN:-https://yourdomain.com}
      ADMIN_EMAIL:   ${ADMIN_EMAIL:-admin@logicrm.local}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-ChangeMe123!}
      DADATA_API_KEY: ${DADATA_API_KEY}
    ports:
      - "127.0.0.1:3000:3000"   # только localhost; внешний трафик через nginx

  # ── Nginx (статика + reverse proxy) ──────────────────────────────────────
  nginx:
    image: nginx:1.25-alpine
    container_name: logicrm_nginx
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./frontend/dist:/var/www/logicrm/dist:ro
      - ./nginx/logicrm.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro        # сертификаты (Let's Encrypt)
      - nginxlogs:/var/log/nginx

volumes:
  pgdata:
  nginxlogs:
