services:
  # ── PostgreSQL ────────────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: logicrm_db
    restart: unless-stopped
    environment:
      POSTGRES_DB:       ${DB_NAME:-logicrm}
      POSTGRES_USER:     ${DB_USER:-logicrm}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    # Аудит 4.5: убираем публикацию порта наружу — только через docker network
    # (раньше было "127.0.0.1:5432:5432", что позволяло ssh-туннели)
    expose:
      - "5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-logicrm}"]
      interval: 10s
      timeout: 5s
      retries: 5
    # Аудит 5.2: ограничения ресурсов и безопасность
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETUID
      - SETGID
    mem_limit: 512m
    cpus: 1.0

  # ── Node.js backend ───────────────────────────────────────────────────────
  backend:
    build:
      context:    ./backend
      dockerfile: Dockerfile
    container_name: logicrm_backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV:      production
      PORT:          3000
      DB_HOST:       postgres
      DB_PORT:       5432
      DB_NAME:       ${DB_NAME:-logicrm}
      DB_USER:       ${DB_USER:-logicrm}
      DB_PASSWORD:   ${DB_PASSWORD}
      JWT_SECRET:    ${JWT_SECRET}
      # Аудит 3.3: CORS_ORIGIN обязателен в production
      CORS_ORIGIN:   ${CORS_ORIGIN:-https://mankochat.ru}
      ADMIN_EMAIL:   ${ADMIN_EMAIL:-admin@logicrm.local}
      # Аудит 1.1: ADMIN_PASSWORD без дефолта — .env обязателен
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      DADATA_API_KEY: ${DADATA_API_KEY:-}
      VAPID_PUBLIC_KEY:  ${VAPID_PUBLIC_KEY:-}
      VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY:-}
    # Аудит 4.5: backend не публикует порт наружу — только внутри docker network
    # nginx → backend:3000 напрямую по внутренней сети
    expose:
      - "3000"
    # Аудит 5.2: ограничения безопасности
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    # tmpfs для /tmp — нужен некоторым Node-библиотекам при read_only
    tmpfs:
      - /tmp
    mem_limit: 512m
    cpus: 1.0

  # ── Nginx (статика + reverse proxy) ──────────────────────────────────────
  nginx:
    image: nginx:1.25-alpine
    container_name: logicrm_nginx
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./frontend/dist:/var/www/logicrm/dist:ro
      - ./nginx/logicrm.conf:/etc/nginx/conf.d/default.conf:ro
      # Сертификаты хранятся вне репозитория на хосте (не в nginx/ssl/).
      # Первичная настройка на сервере:
      #   sudo mkdir -p /opt/logicrm-certs
      #   sudo cp /etc/letsencrypt/archive/mankochat.ru/fullchain*.pem /opt/logicrm-certs/fullchain.pem
      #   sudo cp /etc/letsencrypt/archive/mankochat.ru/privkey*.pem   /opt/logicrm-certs/privkey.pem
      #   sudo chmod 644 /opt/logicrm-certs/*.pem
      # Обновление при выпуске нового сертификата: scripts/renew-certs.sh
      - /opt/logicrm-certs:/etc/nginx/ssl:ro
      - nginxlogs:/var/log/nginx
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETUID
      - SETGID
      - NET_BIND_SERVICE
    mem_limit: 128m
    cpus: 0.5

volumes:
  pgdata:
  nginxlogs:
