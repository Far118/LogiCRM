# LogiCRM — Nginx конфиг
# Раздаёт статику из /var/www/logicrm/dist (Vite build output),
# проксирует /api/* → backend:3000
#
# Изменение относительно оригинала:
#   • root теперь /var/www/logicrm/dist (было /var/www/logicrm)
#   • JS/CSS от Vite имеют content-hash в имени → кеш immutable
#   • HTML по-прежнему не кешируется
#
# docker-compose.yml: нужно изменить том:
#   было:  ./frontend:/var/www/logicrm:ro
#   стало: ./frontend/dist:/var/www/logicrm/dist:ro
#
# Для production: раскомментируй блок HTTPS и настрой certbot.
# 

# Redirect HTTP → HTTPS (раскомментировать в production)
 server {
     listen 80;
     server_name mankochat.ru;
     return 301 https://$host$request_uri;
 }

server {
    listen 80;
     listen 443 ssl;                          # production
    server_name mankochat.ru www.mankochat.ru;

    #  SSL (раскомментировать и настроить в production) 
     ssl_certificate     /etc/nginx/ssl/fullchain.pem;
     ssl_certificate_key /etc/nginx/ssl/privkey.pem;
     ssl_protocols       TLSv1.2 TLSv1.3;
     ssl_ciphers         HIGH:!aNULL:!MD5;
     add_header Strict-Transport-Security "max-age=63072000" always;

    # Vite build output — был /var/www/logicrm, стал /var/www/logicrm/dist
    root  /var/www/logicrm/dist;
    index index.html;

    #  Gzip 
    gzip on;
    gzip_types text/plain text/css application/javascript application/json
               image/svg+xml;
    gzip_min_length 1024;

    #  Заголовки безопасности 
    add_header X-Frame-Options        "SAMEORIGIN"  always;
    add_header X-Content-Type-Options "nosniff"     always;
    add_header Referrer-Policy        "strict-origin-when-cross-origin" always;

    #  Статика: кеш 

    # HTML — не кешируем (всегда свежий)
    location ~* \.html$ {
        expires -1;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    # Vite кладёт JS/CSS с content-hash в имя файла (/assets/index-Dh3gP.js).
    # Такие файлы можно кешировать immutable — содержимое никогда не меняется.
    location ~* ^/assets/.*\.(js|css)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # Прочие JS/CSS (без хэша) — кеш 1 час
    location ~* \.(js|css)$ {
        expires 1h;
        add_header Cache-Control "public, must-revalidate";
        access_log off;
    }

    # Шрифты/картинки — кеш 7 дней
    location ~* \.(woff2?|ttf|svg|png|ico)$ {
        expires 7d;
        add_header Cache-Control "public";
        access_log off;
    }

    #  API → проксируем на Node.js backend 
    location /api/ {
        proxy_pass         http://backend:3000;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_buffering    off;
        proxy_read_timeout    30s;
        proxy_send_timeout    30s;
        proxy_connect_timeout  5s;
    }

    #  MPA: маршруты отдаём конкретный HTML-файл 
    location / {
        try_files $uri $uri.html $uri/ =404;
    }

    #  Логи 
    access_log /var/log/nginx/logicrm_access.log;
    error_log  /var/log/nginx/logicrm_error.log  warn;
}
